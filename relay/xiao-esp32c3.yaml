esphome:
  name: qrio-door-relay
  friendly_name: Qrio Door Relay
  min_version: 2026.10.2

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: WARN
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 1

# No web server, fallback AP, UART target connection or owner keys.
